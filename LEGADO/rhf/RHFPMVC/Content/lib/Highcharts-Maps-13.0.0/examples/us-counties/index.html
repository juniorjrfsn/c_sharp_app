<!DOCTYPE HTML>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Highmaps Example</title>

		<style type="text/css">
:root {
    color-scheme: light dark;
}
body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        "Apple Color Emoji",
        "Segoe UI Emoji",
        "Segoe UI Symbol",
        sans-serif;
    background: var(--highcharts-background-color);
    color: var(--highcharts-neutral-color-100);
}

#container {
    max-width: 800px;
    min-width: 360px;
    margin: 0 auto;
}

/* Custom CSS for the color axis ticks and marker */
.highcharts-coloraxis .highcharts-tick {
    stroke-linecap: round;
    translate: -6px 0;
    filter:
        drop-shadow(0 0 1px rgba(0, 0, 0, 0.1))
        drop-shadow(0 1px 1px rgba(0, 0, 0, 0.09))
        drop-shadow(0 3px 2px rgba(0, 0, 0, 0.05))
        drop-shadow(0 6px 2px rgba(0, 0, 0, 0.01));
    transition: opacity 0.3s ease;
}

/* When the map is hovered, hide the ticks */
.highcharts-root:has(.highcharts-series-group:hover) .highcharts-tick {
    opacity: 0;
}

.highcharts-coloraxis-marker {
    filter:
        drop-shadow(0 0 1px rgba(0, 0, 0, 0.1))
        drop-shadow(0 1px 1px rgba(0, 0, 0, 0.09))
        drop-shadow(0 3px 2px rgba(0, 0, 0, 0.05))
        drop-shadow(0 6px 2px rgba(0, 0, 0, 0.01));
}

@media (prefers-color-scheme: dark) {
    body {
        background-color: #141414;
        color: #ddd;
    }
    a {
        color: #2caffe;
    }
}
		</style>
	</head>
	<body>


<div id="container">
    Downloading map...
</div>

<script src="../../code/highmaps.js"></script>
<script src="../../code/modules/exporting.js"></script>
<script src="../../code/modules/offline-exporting.js"></script>
<script src="../../code/modules/accessibility.js"></script>



		<script type="text/javascript">
(async () => {

    const mapData = await fetch(
        'https://code.highcharts.com/mapdata/countries/us/us-all-all.topo.json'
    ).then(response => response.json());

    const data = await fetch(
        'https://www.highcharts.com/samples/data/us-counties-unemployment.json'
    ).then(response => response.json());

    // Add state acronym for tooltip
    mapData.objects.default.geometries.forEach(g => {
        const properties = g.properties;
        if (properties['hc-key']) {
            properties.name = properties.name + ', ' +
                        properties['hc-key'].substr(3, 2).toUpperCase();
        }
    });

    document.getElementById('container').innerHTML = 'Rendering map...';

    // Create the map
    Highcharts.mapChart('container', {
        chart: {
            map: mapData,
            height: '80%'
        },

        title: {
            text: 'US Counties unemployment rates',
            align: 'left'
        },

        subtitle: {
            text: 'January 2018',
            align: 'left'
        },

        accessibility: {
            description: 'Demo showing a large dataset.'
        },

        legend: {
            layout: 'vertical',
            align: 'right',
            verticalAlign: 'middle',
            y: 42,
            margin: 0,
            borderColor: 'var(--highcharts-neutral-color-5, #f2f2f2)',
            borderWidth: 1,
            borderRadius: 8,
            backgroundColor: 'var(--highcharts-background-color, white)',
            padding: 10,
            shadow: {
                width: 1,
                opacity: 0.03
            },
            symbolRadius: 6
        },

        mapNavigation: {
            enabled: true
        },

        colorAxis: {
            min: -1,
            max: 26,
            tickInterval: 5,
            labels: {
                format: '{value}%'
            },
            startOnTick: false,
            endOnTick: false,
            minColor: '#ebf1ff',
            maxColor: '#0048ff',
            // Dots for ticks, extended also by custom CSS
            tickColor: '#ffffff',
            tickLength: 0.1,
            tickWidth: 6,
            gridLineWidth: 0,
            marker: {
                symbol: 'circle',
                color: 'transparent',
                lineColor: '#fff',
                lineWidth: 3
            }
        },

        plotOptions: {
            mapline: {
                showInLegend: false,
                enableMouseTracking: false
            }
        },

        series: [{
            data: data,
            joinBy: ['hc-key', 'code'],
            name: 'Unemployment rate',
            tooltip: {
                valueSuffix: '%'
            },
            borderWidth: 0.5,

            shadow: false,
            accessibility: {
                enabled: false
            }
        }, {
            type: 'mapline',
            name: 'State borders',
            color: 'white',
            shadow: false,
            borderWidth: 2,
            accessibility: {
                enabled: false
            }
        }],

        tooltip: {
            headerFormat: `<b>{point.name}</b>
                <hr style="border: 0; border-top: 1px solid #8884"/>`,
            pointFormat:
                `<span style="color:{point.color};">\u25CF </span>
                <span style="padding-right: 1em;
                        color: var(--highcharts-neutral-color-40);">
                    {series.name}
                </span>
                <b>{point.value}</b>`,
            useHTML: true
        }
    });

})();

		</script>
	</body>
</html>
