<div id="content-dados" style="position: relative; width: 100%; max-height: 1332px; height: 1332px; min-height: 1332px; ">
    <table class="pagina-content" border="0" style="position: relative; width: 100%; max-height: 1280px; height: 1280px; min-height: 1280px; {corDePagina} ">
        {PageHeader}
        <tr style="position: relative; width: 100%; padding: 0px 0px 0px 0px; ">
            <td style="position: relative; width: 100%; padding: 0px 0px 0px 0px; " valign="top">
                <!-- Conteúdo dinâmico inserido pelo gerarHTML() -->
                <!-- Conteúdo -->
                <!-- Tabela Rel1 existente -->
                <table class="Rel1" id="Rel1" style="width: 100%; position: relative;  padding: 0px 0px 0px 0px; ">
                    {thead}
                    <tbody style="position: relative; width: 100%; padding: 0px 0px 0px 0px; ">
                        {tbodyitens}
                        <!-- Linha vazia para espaço -->
                        <tr style="border: none;">
                            <td colspan="12" style="height: 4px; border: none;"></td>
                        </tr>
                        <!-- Linha de totais -->

                    </tbody>
                </table>
                
                {tableResumo}
            </td>
        </tr>
    </table>
    <table style="position: relative; width: 100%; max-height: 30px; height: 30px; border-radius: 8px;">
        <tr style="position: relative; width: 100%; padding: 0px 0px 0px 0px; border-radius: 8px; ">
            <td style="position: relative; width: 100%; height: 30px; padding: 0px 0px 0px 0px; border-radius: 8px;" valign="bottom">
                <table id="footer" border="0" style="width: 100%">
                    <tbody style="position: relative; width: 100%; padding: 0px 0px 0px 0px; border-radius: 8px;">
                        <tr style="position: relative; width: 100%; padding: 0px 0px 0px 0px; border-radius: 8px;">
                            <td class="footer-left" style="padding: 2px 0px 2px 0px;">DIRGIN/AGEPREV-MS</td>
                            <td class="footer-center"style="padding: 2px 50px 2px 0px;text-align:center;">Página {pagina} de {totalPagina}</td>
                            <td class="footer-right"style="padding: 2px 2px 2px 0px; ">Data da Inclusão {dataGeracao}</td>
                        </tr>
                    </tbody>
                </table>
            </td>
        </tr>
    </table>
</div>
